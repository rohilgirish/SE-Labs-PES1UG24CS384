<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="dashed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Lab 1: UML Use-Case Diagram</text>
  <text x="550" y="60" text-anchor="middle" font-size="14" fill="#475569">Problem Statement #16: Remote Patient Vitals Alert &amp; Monitoring App | SRN: PES1UG24CS384</text>

  <!-- System Boundary Box -->
  <rect x="230" y="80" width="640" height="740" rx="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="230" y="80" width="640" height="36" rx="12" fill="#dbeafe"/>
  <text x="550" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">System: Remote Patient Vitals Alert &amp; Monitoring System</text>

  <!-- ================= ACTORS (LEFT) ================= -->
  
  <!-- Remote Patient -->
  <g transform="translate(110, 240)">
    <circle cx="0" cy="-25" r="14" fill="#fff" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="-11" x2="0" y2="20" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="-14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <text x="0" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Remote Patient</text>
    <text x="0" y="84" text-anchor="middle" font-size="11" fill="#64748b">&lt;&lt;Primary Actor&gt;&gt;</text>
  </g>

  <!-- IoT Vital Sensor Device -->
  <g transform="translate(110, 430)">
    <rect x="-35" y="-35" width="70" height="50" rx="8" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#0284c7" stroke-width="3"/>
    <circle cx="-15" cy="0" r="3" fill="#10b981"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
    <circle cx="15" cy="0" r="3" fill="#ef4444"/>
    <text x="0" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">IoT Sensor Device</text>
    <text x="0" y="48" text-anchor="middle" font-size="11" fill="#64748b">&lt;&lt;System / Device&gt;&gt;</text>
  </g>

  <!-- Clinical Administrator / Doctor -->
  <g transform="translate(110, 640)">
    <circle cx="0" cy="-25" r="14" fill="#fff" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="-11" x2="0" y2="20" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="-14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <text x="0" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Doctor / Admin</text>
    <text x="0" y="84" text-anchor="middle" font-size="11" fill="#64748b">&lt;&lt;Secondary Actor&gt;&gt;</text>
  </g>

  <!-- ================= ACTORS (RIGHT) ================= -->

  <!-- On-Call Caregiver -->
  <g transform="translate(980, 270)">
    <circle cx="0" cy="-25" r="14" fill="#fff" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="-11" x2="0" y2="20" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="-14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="14" y2="48" stroke="#1e293b" stroke-width="2.5"/>
    <text x="0" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">On-Call Caregiver</text>
    <text x="0" y="84" text-anchor="middle" font-size="11" fill="#64748b">&lt;&lt;Primary Actor&gt;&gt;</text>
  </g>

  <!-- Tier-2 Emergency Matrix -->
  <g transform="translate(980, 580)">
    <circle cx="0" cy="-25" r="14" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="0" y1="-11" x2="0" y2="20" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="-14" y2="48" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="0" y1="20" x2="14" y2="48" stroke="#dc2626" stroke-width="2.5"/>
    <text x="0" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">Tier-2 Matrix</text>
    <text x="0" y="84" text-anchor="middle" font-size="11" fill="#dc2626">&lt;&lt;Secondary / Rapid Response&gt;&gt;</text>
  </g>


  <!-- ================= USE CASES (OVALS) ================= -->

  <!-- UC-01: Ingest Telemetry -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="165" rx="140" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="400" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-01: Stream &amp; Ingest Vitals</text>
    <text x="400" y="177" text-anchor="middle" font-size="10.5" fill="#475569">(SpO2, Heart Rate, BP)</text>
  </g>

  <!-- UC-04: Evaluate Clinical Thresholds -->
  <g filter="url(#shadow)">
    <ellipse cx="690" cy="165" rx="140" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="690" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-04: Evaluate Clinical Thresholds</text>
    <text x="690" y="177" text-anchor="middle" font-size="10.5" fill="#475569">(Anomaly Detection &lt; 2s)</text>
  </g>

  <!-- UC-02: Monitor Patient Dashboard -->
  <g filter="url(#shadow)">
    <ellipse cx="540" cy="265" rx="150" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="540" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-02: Monitor Patient Vitals Dashboard</text>
    <text x="540" y="277" text-anchor="middle" font-size="10.5" fill="#475569">(Real-Time Biometrics &amp; Status)</text>
  </g>

  <!-- UC-03: Process Critical Vital Breach -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="370" rx="150" ry="32" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="400" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#9f1239">UC-03: Process Vital Breach &amp;</text>
    <text x="400" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#9f1239">Escalate Caregiver Alert [CORE]</text>
  </g>

  <!-- UC-06: Acknowledge Emergency Alert -->
  <g filter="url(#shadow)">
    <ellipse cx="710" cy="370" rx="135" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="710" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-06: Acknowledge Emergency Alert</text>
    <text x="710" y="382" text-anchor="middle" font-size="10.5" fill="#475569">(Caregiver Triage &amp; Silence Siren)</text>
  </g>

  <!-- UC-07: Escalate to Tier-2 Caregiver Matrix -->
  <g filter="url(#shadow)">
    <ellipse cx="710" cy="490" rx="145" ry="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="710" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">UC-07: Escalate to Tier-2 Matrix</text>
    <text x="710" y="502" text-anchor="middle" font-size="10.5" fill="#991b1b">(Backup Staff / Rapid Response)</text>
  </g>

  <!-- UC-08: Trigger Manual Emergency SOS Panic -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="490" rx="145" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="400" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-08: Trigger Manual Emergency SOS</text>
    <text x="400" y="502" text-anchor="middle" font-size="10.5" fill="#475569">(Patient Panic Button + GPS)</text>
  </g>

  <!-- UC-05: Configure Patient Baseline Thresholds -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="620" rx="145" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="400" y="617" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-05: Configure Baseline Thresholds</text>
    <text x="400" y="632" text-anchor="middle" font-size="10.5" fill="#475569">(Post-Op Custom Ranges)</text>
  </g>

  <!-- UC-09: Export Historical Vitals & Trend Report -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="730" rx="145" ry="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="400" y="727" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">UC-09: Export Vitals &amp; Trend Report</text>
    <text x="400" y="742" text-anchor="middle" font-size="10.5" fill="#475569">(24-48h PDF / CSV Analytics)</text>
  </g>

  <!-- ================= ASSOCIATIONS & RELATIONSHIPS ================= -->

  <!-- Sensor -> UC1 -->
  <line x1="150" y1="420" x2="270" y2="185" stroke="#1e293b" stroke-width="1.6"/>

  <!-- Patient -> UC2, UC8 -->
  <line x1="140" y1="240" x2="400" y2="260" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="140" y1="260" x2="270" y2="475" stroke="#1e293b" stroke-width="1.6"/>

  <!-- Caregiver -> UC2, UC6, UC3 -->
  <line x1="940" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="940" y1="290" x2="825" y2="355" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="940" y1="280" x2="545" y2="365" stroke="#e11d48" stroke-width="1.6"/>

  <!-- Doctor -> UC5, UC9 -->
  <line x1="140" y1="640" x2="265" y2="625" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="140" y1="660" x2="265" y2="725" stroke="#1e293b" stroke-width="1.6"/>

  <!-- UC7 -> Tier2 Actor -->
  <line x1="845" y1="505" x2="940" y2="570" stroke="#dc2626" stroke-width="1.8"/>

  <!-- <<include>> UC1 -> UC4 -->
  <line x1="540" y1="165" x2="550" y2="165" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>
  <text x="545" y="153" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">&lt;&lt;include&gt;&gt;</text>

  <!-- <<include>> UC3 -> UC4 -->
  <path d="M 460 340 L 640 190" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>
  <text x="575" y="245" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155" transform="rotate(-38 575 245)">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>> UC7 -> UC6 [Timeout > 60s] -->
  <line x1="710" y1="460" x2="710" y2="400" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>
  <text x="790" y="430" text-anchor="start" font-size="10.5" font-weight="bold" fill="#dc2626">&lt;&lt;extend&gt;&gt;<tspan x="790" dy="13" font-size="9.5" font-weight="normal" fill="#991b1b">[Timeout &gt; 60s]</tspan></text>

  <!-- <<extend>> UC7 -> UC8 [Critical SOS] -->
  <line x1="565" y1="490" x2="545" y2="490" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>
  <text x="555" y="478" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">&lt;&lt;extend&gt;&gt;</text>

</svg>
