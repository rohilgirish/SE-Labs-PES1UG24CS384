  <text x="350" y="334" text-anchor="middle" font-size="9.5" fill="#475569">Stream Packet Pipeline</text>

  <!-- ================= TIER 4: DATA PERSISTENCE SUBSYSTEM ================= -->
  <rect x="40" y="700" width="1170" height="175" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="40" y="700" width="260" height="24" rx="8" fill="#dbeafe"/>
  <text x="50" y="716" font-size="11" font-weight="bold" fill="#1e40af">Data Persistence &amp; Storage Subsystem</text>

  <!-- Database 1: Time-Series Vitals DB -->
  <g transform="translate(100, 745)">
    <path d="M 0 12 C 0 0 180 0 180 12 L 180 75 C 180 87 0 87 0 75 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="90" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Time-Series Vitals DB</text>
    <text x="90" y="60" text-anchor="middle" font-size="9.5" fill="#0369a1">(TimescaleDB / InfluxDB)</text>
  </g>

  <!-- Database 2: Caregiver Profiles & Matrix -->
  <g transform="translate(380, 745)">
    <path d="M 0 12 C 0 0 180 0 180 12 L 180 75 C 180 87 0 87 0 75 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="90" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Caregiver &amp; Patient DB</text>
    <text x="90" y="60" text-anchor="middle" font-size="9.5" fill="#0369a1">(PostgreSQL Master)</text>
