    <rect x="0" y="0" width="260" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="-10" y="8" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="-10" y="24" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="130" y="22" text-anchor="middle" font-size="10" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="38" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Analytics &amp; Reporting Service</text>
    <text x="130" y="50" text-anchor="middle" font-size="9" fill="#475569">(24-48h Trend Export &amp; PDF)</text>
