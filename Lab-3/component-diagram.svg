    <rect x="0" y="0" width="260" height="60" rx="6" fill="#f8fafc" stroke="#047857" stroke-width="2"/>
    <rect x="-10" y="8" width="20" height="10" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
    <rect x="-10" y="24" width="20" height="10" fill="#d1fae5" stroke="#047857" stroke-width="1.2"/>
    <text x="130" y="22" text-anchor="middle" font-size="10" fill="#065f46">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="38" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">Compliance &amp; Audit Logger</text>
    <text x="130" y="50" text-anchor="middle" font-size="9" fill="#047857">(HIPAA Immutable WORM Chain)</text>
