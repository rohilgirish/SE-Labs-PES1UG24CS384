  <g transform="translate(940, 745)">
    <path d="M 0 12 C 0 0 180 0 180 12 L 180 75 C 180 87 0 87 0 75 Z" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="#d1fae5" stroke="#047857" stroke-width="1.8"/>
    <text x="90" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Immutable Audit Ledger</text>
