  <line x1="790" y1="445" x2="750" y2="745" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#red-arrow)"/>
  <line x1="1070" y1="445" x2="470" y2="745" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>
  <line x1="810" y1="580" x2="1030" y2="745" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dashed-arrow)"/>

</svg>
