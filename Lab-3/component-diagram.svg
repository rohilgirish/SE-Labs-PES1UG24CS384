  </defs>

  <!-- Title Header -->
  <text x="625" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">UML 2.5 Component Diagram: Remote Patient Vitals Alert &amp; Monitoring System</text>
  <text x="625" y="52" text-anchor="middle" font-size="12" fill="#64748b">Scenario #16: Healthcare &amp; Telemedicine | Student SRN: PES1UG24CS384 | Course: UE24CS341A</text>

  <!-- ================= TIER 1: CLIENT PRESENTATION SUBSYSTEM ================= -->
  <rect x="40" y="75" width="1170" height="110" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="40" y="75" width="280" height="24" rx="8" fill="#dbeafe"/>
  <text x="50" y="91" font-size="11" font-weight="bold" fill="#1e40af">Client Presentation Subsystem</text>

  <!-- Patient Wearable App Component -->
  <g filter="url(#shadow)" transform="translate(160, 110)">
    <rect x="0" y="0" width="280" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="-10" y="8" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="-10" y="24" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="140" y="24" text-anchor="middle" font-size="10" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="140" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Patient Wearable Telemetry App</text>
  </g>

  <!-- Caregiver Clinical Portal Component -->
  <g filter="url(#shadow)" transform="translate(780, 110)">
    <rect x="0" y="0" width="280" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="-10" y="8" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="-10" y="24" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="140" y="24" text-anchor="middle" font-size="10" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="140" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Caregiver Clinical Portal</text>
