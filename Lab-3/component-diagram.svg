  <g filter="url(#shadow)" transform="translate(70, 380)">
    <rect x="0" y="0" width="240" height="65" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="-10" y="8" width="20" height="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
