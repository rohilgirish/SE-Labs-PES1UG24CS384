  <circle cx="335" cy="412" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="402" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e40af">IVitalEvaluation</text>

  <line x1="610" y1="412" x2="660" y2="412" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="635" cy="412" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="402" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#dc2626">IAlertNotification</text>

  <line x1="920" y1="412" x2="970" y2="412" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="945" cy="412" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="945" y="402" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e40af">IThresholdRuleLookup</text>

