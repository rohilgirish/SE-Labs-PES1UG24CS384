  <circle cx="300" cy="210" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="214" font-size="10" font-weight="bold" fill="#1e40af">ITelemetryIngressAPI</text>

  <line x1="920" y1="170" x2="920" y2="245" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="920" cy="210" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="815" y="214" font-size="10" font-weight="bold" fill="#1e40af">ICaregiverAPI</text>

