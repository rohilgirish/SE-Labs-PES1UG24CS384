  <!-- Database 3: Redis Alert Cache -->
  <g transform="translate(660, 745)">
    <path d="M 0 12 C 0 0 180 0 180 12 L 180 75 C 180 87 0 87 0 75 Z" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
    <ellipse cx="90" cy="12" rx="90" ry="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="90" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Alert State Cache (Redis)</text>
    <text x="90" y="60" text-anchor="middle" font-size="9.5" fill="#b91c1c">(Sub-5ms SLA Timers)</text>
